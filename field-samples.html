<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>球場デザイン サンプル — SQUAD NINE</title>
<style>
  body {
    margin: 0; padding: 24px 18px 60px;
    background: #0e1116; color: #e8edf3;
    font-family: "Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 6px; letter-spacing: .06em; }
  .lead { font-size: 13px; color: #93a1b0; margin: 0 0 24px; }
  .grid {
    display: grid; gap: 22px; max-width: 1500px; margin: 0 auto;
    grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
  }
  .card { background: #161b22; border: 1px solid #2c3540; border-radius: 14px; padding: 12px; }
  .card h2 { font-size: 14px; margin: 2px 2px 10px; }
  .card h2 span { color: #ff6b2c; font-weight: 800; margin-right: 7px; }
  .card .id { float: right; font-size: 11px; color: #64707d; font-weight: 400; }
  .frame { position: relative; width: 100%; aspect-ratio: 1000/1010; border-radius: 10px; overflow: hidden; }
  .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .marks { position: absolute; inset: 0; }
  .mk {
    position: absolute; transform: translate(-50%,-50%);
    width: 9.4%; aspect-ratio: 1; border-radius: 50%;
    background: rgba(10,14,19,.72); border: 3px solid #ff6b2c;
    display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: clamp(10px, 2vw, 16px);
  }
  .toggle { margin: 0 auto 18px; max-width: 1500px; font-size: 13px; color: #93a1b0; }
  .toggle label { cursor: pointer; }
</style>
</head>
<body>

<h1>球場デザイン サンプル</h1>
<p class="lead">セ・リーグ6球団の本拠地を元にしたデザイン。真似ているのは「内野が芝か土か」「土の色」「外野フェンス前の土の有無」「フェンスの色」の4点だけです。<br>色が違うところがあれば教えてください。</p>

<div class="toggle"><label><input type="checkbox" id="showMarks" checked> 守備位置の当たりを表示</label></div>

<div class="grid" id="grid"></div>

<script src="field.js"></script>
<script>
  const POS = [
    { k: '投', x: 50,   y: 61.6 },
    { k: '捕', x: 50,   y: 86.7 },
    { k: '一', x: 67.6, y: 59.2 },
    { k: '二', x: 62.0, y: 46.1 },
    { k: '三', x: 32.4, y: 59.2 },
    { k: '遊', x: 38.0, y: 46.1 },
    { k: '左', x: 21.2, y: 36.8 },
    { k: '中', x: 50,   y: 28.5 },
    { k: '右', x: 78.8, y: 36.8 }
  ];

  const grid = document.getElementById('grid');
  FIELD.styles.forEach((st, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<h2><span>' + (i + 1) + '</span>' + st.label +
      '<span class="id">' + st.id + '</span></h2>' +
      '<div class="frame">' +
        '<svg viewBox="' + FIELD.viewBox + '" preserveAspectRatio="xMidYMid meet">' + FIELD.build(st.id) + '</svg>' +
        '<div class="marks">' +
          POS.map(p => '<div class="mk" style="left:' + p.x + '%;top:' + p.y + '%">' + p.k + '</div>').join('') +
        '</div>' +
      '</div>';
    grid.appendChild(card);
  });

  // 同一ページに複数のSVGを置くと defs の id が衝突するので、カードごとに接頭辞を付ける
  document.querySelectorAll('.frame svg').forEach((svg, i) => {
    svg.innerHTML = svg.innerHTML
      .replace(/id="([^"]+)"/g, 'id="c' + i + '_$1"')
      .replace(/url\(#([^)]+)\)/g, 'url(#c' + i + '_$1)');
  });

  document.getElementById('showMarks').addEventListener('change', e => {
    document.querySelectorAll('.marks').forEach(m => m.style.display = e.target.checked ? '' : 'none');
  });
</script>
</body>
</html>
