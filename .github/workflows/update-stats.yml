# 成績データの毎日自動更新
#
# 仕組み: 毎日 JST 11:00 に全選手の成績を取得し、差分があるときだけ
# data/npb-stats.js をコミットする（コミットされると GitHub Pages が自動で再公開）。
# 取得元はプロ野球データFreak (baseball-data.com) を優先し、取得に失敗した日は
# NPB公式 (npb.jp) に自動で切り替える（tools/fetch-stats.ps1 の -Source auto）。
#
# 前日に試合がなければ成績は変わらない＝差分ゼロで自動スキップされるため、
# 「月曜は基本休みだが祝日・振替・CS・日本シリーズは開催あり」といった
# カレンダー例外を一切気にしなくてよい。オフシーズンも差分が出ないだけで実害なし。
#
# ▼ 止めたいとき: 下の schedule 2行をコメントアウトする
# ※ GitHub Actions の cron は数分〜15分ほど遅れることがある（11:00 ごろに実行される）
# ※ リポジトリに60日間コミットがないと schedule は自動停止される（Actions画面で再有効化）

name: update-stats

on:
  schedule:
    - cron: '0 2 * * *'   # JST 11:00 (= UTC 02:00)
  workflow_dispatch:       # 手動実行もいつでも可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: 成績を取得（データFreak優先・失敗時はNPB公式）
        shell: pwsh
        run: pwsh -File tools/fetch-stats.ps1 -Source auto

      - name: 差分があればコミット（試合がなかった日はスキップ）
        run: |
          git config user.name "squad-nine-bot"
          git config user.email "gen-murayama@alfaras.jp"
          git add data/npb-stats.js
          # updated: の日付行だけの変化は「差分なし」とみなす
          if git diff --cached -I "updated:" --quiet; then
            echo "成績に変化なし（前日は試合なし）。コミットをスキップ"
            git reset
          else
            git commit -m "成績データ自動更新 $(date +%Y-%m-%d)"
            git push
          fi
